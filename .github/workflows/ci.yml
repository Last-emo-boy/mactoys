name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Needs Xcode 27 (Swift 6.4, macOS 27 SDK); this image's default Xcode is 27.1.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Check localizations
        run: python3 scripts/i18n-lint.py
